[project]
name = "marker-humidor"
version = "0.1.0"
description = "Feedback pages for dry-erase marker humidors, on Unison Cloud"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pillow>=11",
    "pydantic>=2.9",
    "segno>=1.6",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
humidor = "humidor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["humidor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B904", # raise typer.Exit() inside except is intentional flow control
    "E501", # ruff format owns line length; long strings and embedded Unison stay as written
]
